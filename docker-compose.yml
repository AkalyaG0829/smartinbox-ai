version: '3.8'

services:
  db:
    image: ankane/pgvector:latest
    container_name: smartinbox_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: smartinbox_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrator:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    container_name: smartinbox_migrator
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
    command: alembic upgrade head

  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    container_name: smartinbox_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      migrator:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    volumes:
      - .:/app
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000

  ml_worker:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    container_name: smartinbox_ml_worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - WORKER_ROLE=ml
      - OMP_NUM_THREADS=1
      - TOKENIZERS_PARALLELISM=false
    depends_on:
      migrator:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    volumes:
      - .:/app
    command: celery -A src.worker.celery_app worker -Q ml_queue --loglevel=info --pool=threads --concurrency=2

  routing_worker:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    container_name: smartinbox_routing_worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - WORKER_ROLE=routing
    depends_on:
      migrator:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    volumes:
      - .:/app
    command: celery -A src.worker.celery_app worker -Q routing_queue --loglevel=info

  celery_exporter:
    image: danihodovic/celery-exporter:latest
    container_name: smartinbox_celery_exporter
    restart: unless-stopped
    command:
      - '--broker-url=redis://redis:6379/0'
    depends_on:
      redis:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:latest
    container_name: smartinbox_prometheus
    restart: unless-stopped
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/prometheus/alert.rules.yml:/etc/prometheus/alert.rules.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    depends_on:
      - backend
      - celery_exporter

  grafana:
    image: grafana/grafana:latest
    container_name: smartinbox_grafana
    restart: unless-stopped
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

  alertmanager:
    image: prom/alertmanager:latest
    container_name: smartinbox_alertmanager
    restart: unless-stopped
    volumes:
      - ./docker/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/frontend/Dockerfile
    container_name: smartinbox_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      backend:
        condition: service_started

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
  alertmanager_data:
